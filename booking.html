<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Xixi Escort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Booking</a>
        <a href="faq.html">FAQ</a>
    </nav>
    <div class="container">
        <h1>Simulated Booking</h1>
        <div class="card">
            <h2>Calculate Your Price</h2>
            <label>Map Type:</label>
            <select id="map" onchange="calculateTotal()">
                <option value="0">Zero Dam (Normal) - $0</option>
                <option value="10">Zero Dam (Secret) - $10</option>
                <option value="20">Space City (Secret) - $20</option>
            </select>
            <br><br>
            <label>Escort Level:</label>
            <select id="level" onchange="calculateTotal()">
                <option value="0">Standard (普通打手) - $0</option>
                <option value="15">Elite (精英) - $15</option>
                <option value="30">God Tier (顶尖大神) - $30</option>
            </select>
            <br><br>
            <h3 style="color:#fff;">Total Estimated Cost: <span id="totalPrice" style="color:var(--primary-color);">$0</span></h3>
            <button onclick="submitOrder()" style="margin-top:15px; padding:10px 20px; background:var(--primary-color); color:#000; border:none; font-weight:bold; cursor:pointer;">Confirm Booking</button>
        </div>
    </div>
    <script>
        function calculateTotal() {
            let mapPrice = parseInt(document.getElementById('map').value);
            let levelPrice = parseInt(document.getElementById('level').value);
            let total = mapPrice + levelPrice;
            document.getElementById('totalPrice').innerText = "$" + total;
        }
        function submitOrder() {
            alert("Booking Simulated! Please contact our support on WeChat to complete the order.");
        }
    </script>
</body>
</html>
