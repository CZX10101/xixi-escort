<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - Xixi Escort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="booking.html">Booking</a>
        <a href="faq.html">FAQ</a>
    </nav>
    <div class="container">
        <h1>Simulated Booking</h1>
        <div class="card">
            <h2>Calculate Your Price</h2>
            
            <label>Map Type (地图模式):</label>
            <select id="map" onchange="checkRulesAndCalculate()">
                <option value="10">机密局 (Confidential) - $10</option>
                <option value="20">绝密局 (Top Secret) - $20</option>
            </select>
            <br><br>

            <label>Escort Level (打手级别):</label>
            <select id="level" onchange="checkRulesAndCalculate()">
                <option value="0">211 (仅限机密) - $0</option>
                <option value="15">985 (精英) - $15</option>
                <option value="30">大专 (绝活哥) - $30</option>
                <option value="50">明星 (全服顶尖) - $50</option>
            </select>
            <br><br>

            <!-- 用来提示兼容性错误的红字 -->
            <p id="error-msg" style="color: #e74c3c; font-weight: bold; display: none;">
                ⚠️ 211 打手只能接机密局！请更换打手或地图。
            </p>

            <h3 style="color:#fff;">Total Estimated Cost: <span id="totalPrice" style="color:var(--primary-color);">$10</span></h3>
            
            <button id="submit-btn" onclick="submitOrder()" style="margin-top:15px; padding:10px 20px; background:var(--primary-color); color:#000; border:none; font-weight:bold; cursor:pointer;">Confirm Booking</button>
        </div>
    </div>

    <script>
        function checkRulesAndCalculate() {
            let mapValue = document.getElementById('map').value;
            let levelValue = document.getElementById('level').value;
            
            let errorMsg = document.getElementById('error-msg');
            let submitBtn = document.getElementById('submit-btn');

            // 核心业务逻辑：如果选了 211 (value="0")，且选了绝密局 (value="20")
            if (levelValue === "0" && mapValue === "20") {
                errorMsg.style.display = "block"; // 显示红字警告
                submitBtn.disabled = true; // 禁用下单按钮
                document.getElementById('totalPrice').innerText = "N/A";
            } else {
                errorMsg.style.display = "none"; // 隐藏警告
                submitBtn.disabled = false; // 恢复下单按钮
                calculateTotal(); // 正常计算价格
            }
        }

        function calculateTotal() {
            let mapPrice = parseInt(document.getElementById('map').value);
            let levelPrice = parseInt(document.getElementById('level').value);
            
            // 如果没报错，就正常计算
            if (!document.getElementById('error-msg').style.display || document.getElementById('error-msg').style.display === "none") {
                document.getElementById('totalPrice').innerText = "$" + (mapPrice + levelPrice);
            }
        }

        function submitOrder() {
            alert("预订成功！(Simulated) Please contact Xixi Escort support on WeChat to complete payment.");
        }
    </script>
</body>
</html>
